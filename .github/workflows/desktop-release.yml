name: Desktop Release

# Builds the Pelbu POS Windows installer (Electron + PocketBase + Next export)
# and publishes it to the cloud update feed — WITHOUT any AWS credentials.
#
# The GitHub runner is off-box, so it can't use the EC2 instance role. Instead of
# `aws s3 cp` (which would need stored AWS keys), the runner POSTs the built .exe
# to the box, which uploads it to S3 via its instance role and registers the
# release. So the only secrets this pipeline needs are APP_URL + RELEASE_INGEST_TOKEN.
#
# Lives on the isolated `desktop` branch (main is SilverPine's travel site).
# Cut a release: `git tag desktop-vX.Y.Z && git push origin desktop desktop-vX.Y.Z`.
# Building NSIS needs a real Windows toolchain, so this runs on windows-latest.

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Informational only; the build uses desktop/package.json version'
        required: false

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        # electron:build:win = fetch pocketbase.exe (win32) + next build + electron-builder --win (NSIS).
        # --publish never: distribution is via the box upload endpoint below, not GitHub Releases.
        run: npm run electron:build:win -- --publish never

      - name: Resolve version + artifact + channel
        id: meta
        shell: bash
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "exe=$(ls release/*.exe | head -1)"                      >> "$GITHUB_OUTPUT"
          # Tags containing -beta/-rc publish to the beta channel; terminals only
          # query stable, so beta releases are invisible to production terminals.
          case "${GITHUB_REF_NAME:-}" in
            *beta*|*rc*) echo "channel=beta"   >> "$GITHUB_OUTPUT" ;;
            *)           echo "channel=stable" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Upload installer + publish (keyless — box writes to S3 via instance role)
        shell: bash
        env:
          APP_URL: ${{ secrets.APP_URL }}
          RELEASE_INGEST_TOKEN: ${{ secrets.RELEASE_INGEST_TOKEN }}
        run: |
          curl -fsS -X POST "${APP_URL}/api/desktop/releases/upload" \
            -H "x-release-token: ${RELEASE_INGEST_TOKEN}" \
            -F "file=@${{ steps.meta.outputs.exe }}" \
            -F "version=${{ steps.meta.outputs.version }}" \
            -F "channel=${{ steps.meta.outputs.channel }}" \
            -F "platform=win" \
            -F "notes=Automated build from ${GITHUB_REF_NAME:-manual}" \
            -F "publish=true"

      - name: Upload installer as workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: pelbu-pos-windows
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
          if-no-files-found: error
