name: Desktop Release

# Builds the Pelbu POS Windows installer (Electron + PocketBase + Next export) and publishes it
# to the cloud update feed: the runner uploads the .exe to S3 and then registers the release with
# the app, which is what terminals poll through /api/desktop/releases/latest.
#
# HISTORY, so nobody re-breaks this: the monorepo moved to a "keyless" variant that POSTed the
# installer to `${APP_URL}/api/desktop/releases/upload` and had the box write to S3 via its EC2
# instance role. That endpoint does NOT exist in this repo — `web/` only serves
# /api/desktop/releases/register — so the keyless version 404s at the publish step after a
# ~15-minute Windows build. This is the two-step path that actually shipped 1.4.0, restored.
#
# Secrets used: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (S3 write), APP_URL +
# RELEASE_INGEST_TOKEN (register). All four exist on this repo.
#
# Cut a release: `git tag desktop-vX.Y.Z && git push origin desktop-vX.Y.Z`.
# A tag containing -beta or -rc publishes to the BETA channel, which stable terminals never poll —
# that is how you get an installer to QA on a real Windows terminal without touching any shop.
# Building NSIS needs a real Windows toolchain, so this runs on windows-latest.

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Informational only; the build uses desktop/package.json version'
        required: false

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      S3_BUCKET: edgepos-images-430286912237-ap-south-2-an
      S3_PREFIX: releases
      CDN_BASE: https://img.pelbu.com
      AWS_REGION: ap-south-2
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        # electron:build:win = fetch pocketbase.exe (win32) + next build + electron-builder --win (NSIS).
        # --publish never: distribution is S3 + the register API below, not GitHub Releases, so
        # electron-builder must not try to publish (it auto-publishes on a git tag otherwise and
        # then demands GH_TOKEN).
        run: npm run electron:build:win -- --publish never

      - name: Resolve version + artifact + channel
        id: meta
        shell: bash
        run: |
          EXE=$(ls release/*.exe | head -1)
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "exe=$EXE"                             >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$EXE")"              >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$EXE")"             >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$EXE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          # Tags containing -beta/-rc publish to the beta channel; terminals only
          # query stable, so beta releases are invisible to production terminals.
          case "${GITHUB_REF_NAME:-}" in
            *beta*|*rc*) echo "channel=beta"   >> "$GITHUB_OUTPUT" ;;
            *)           echo "channel=stable" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload installer to S3
        shell: bash
        run: |
          aws s3 cp "${{ steps.meta.outputs.exe }}" \
            "s3://${S3_BUCKET}/${S3_PREFIX}/${{ steps.meta.outputs.version }}/${{ steps.meta.outputs.name }}" \
            --content-type application/octet-stream \
            --cache-control "public, max-age=31536000, immutable"

      - name: Register release in app (publishes it to the update feed)
        shell: bash
        env:
          APP_URL: ${{ secrets.APP_URL }}
          RELEASE_INGEST_TOKEN: ${{ secrets.RELEASE_INGEST_TOKEN }}
        run: |
          DOWNLOAD_URL="${CDN_BASE}/${S3_PREFIX}/${{ steps.meta.outputs.version }}/${{ steps.meta.outputs.name }}"
          jq -n \
            --arg v    "${{ steps.meta.outputs.version }}" \
            --arg ch   "${{ steps.meta.outputs.channel }}" \
            --arg url  "$DOWNLOAD_URL" \
            --arg name "${{ steps.meta.outputs.name }}" \
            --argjson size ${{ steps.meta.outputs.size }} \
            --arg sha  "${{ steps.meta.outputs.sha256 }}" \
            --arg notes "Automated build from ${GITHUB_REF_NAME:-manual}" \
            '{version:$v, channel:$ch, platform:"win", download_url:$url, file_name:$name, file_size:$size, sha256:$sha, notes:$notes, publish:true}' \
          | curl -fsS -X POST "${APP_URL}/api/desktop/releases/register" \
              -H "x-release-token: ${RELEASE_INGEST_TOKEN}" \
              -H "Content-Type: application/json" \
              --data @-

      - name: Upload installer as workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: pelbu-pos-windows
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
          if-no-files-found: error
